# Weekly dependency updates, grouped per ecosystem so each week is one PR per
# component instead of dozens. Security updates are not grouped and arrive as
# soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: gomod
    directory: /gateway
    schedule: { interval: weekly }
    groups:
      gateway-go: { patterns: ['*'] }

  - package-ecosystem: uv
    directory: /compute
    schedule: { interval: weekly }
    groups:
      compute-python: { patterns: ['*'] }

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      client-npm: { patterns: ['*'] }

  - package-ecosystem: docker
    directories: [/gateway, /compute, /client]
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ['*'] }

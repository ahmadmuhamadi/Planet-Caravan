# CI: lint, type-check, test, audit and build the image for each component.
#
# - Pull requests / pushes to main: only components whose files changed run.
# - Tag builds (via release.yml) and manual runs: everything runs.
# - "CI OK" is the single status check to require in branch protection; it
#   passes when every component job passed or was skipped as unchanged.
#
# Third-party actions are pinned to full commit SHAs (version in the comment);
# Dependabot keeps them current.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; main and tags always run to completion.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  UV_VERSION: 0.11.15

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gateway: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.gateway }}
      compute: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.compute }}
      client: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        # Tags and manual runs skip filtering, which makes every output 'true'.
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            gateway:
              - *ci
              - gateway/**
            compute:
              - *ci
              - compute/**
            client:
              - *ci
              - client/**

  gateway:
    name: Gateway (Go)
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint and format check (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: gateway

      - name: Test (race detector)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Vulnerability scan (govulncheck)
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Build binary
        run: go build -trimpath -o /dev/null ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  compute:
    name: Compute (Python)
    needs: changes
    if: needs.changes.outputs.compute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: compute
          enable-cache: true
          cache-dependency-glob: compute/uv.lock

      - name: Install (exactly as locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Test (offline, D8)
        # Tests that need live services are marked `network` and excluded here.
        run: uv run pytest -m "not network"

      - name: Vulnerability scan (pip-audit)
        run: uv run pip-audit --strict --progress-spinner off

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: compute
          push: false
          cache-from: type=gha,scope=compute
          cache-to: type=gha,scope=compute,mode=max

  client:
    name: Client (SvelteKit)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install (exactly as locked)
        run: npm ci

      - name: Install browser for component tests
        run: npx playwright install --with-deps chromium

      - name: Lint and format check (eslint, prettier)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Vulnerability scan (runtime dependencies)
        # Dev-tool advisories (eslint, vite plugins) don't ship to users; they
        # are handled by Dependabot updates rather than blocking CI.
        run: npm audit --omit=dev --audit-level=high

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, gateway, compute, client]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job ended with '$r'"; exit 1 ;;
            esac
          done

# On a vX.Y.Z tag: run CI, then push images to ghcr.io/<owner>/planet-caravan-<component>:<tag>.
# Deploy step comes later, once the host (AWS or GCP) is picked.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [gateway, compute, client]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        working-directory: ${{ matrix.component }}
        env:
          OWNER: ${{ github.repository_owner }}
          GATEWAY_URL: ${{ vars.PUBLIC_GATEWAY_URL }}
        run: |
          image="ghcr.io/${OWNER,,}/planet-caravan-${{ matrix.component }}:${GITHUB_REF_NAME}"
          docker build --build-arg "PUBLIC_GATEWAY_URL=${GATEWAY_URL}" -t "$image" .
          docker push "$image"
